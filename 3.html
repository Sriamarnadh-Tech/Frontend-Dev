<!DOCTYPE html>
<html>
<head>
    <title>Course Registration</title>
</head>
<body>
    <h1>Course Registration Form</h1>

    <form>
        <fieldset>
            <legend>Student Details</legend>
            Name: <input type="text" name="name"><br><br>
            Email: <input type="email" name="email"><br><br>
            Select Course:
            <select>
                <option selected>Select a Course</option>
                <option>B.Tech CSE</option>
                <option>BCA</option>
                <option>MCA</option>
            </select>
        </fieldset>
    </form>

    <h2>Available Course Schedules</h2>
    <table border="1">
        <tr><th>Day</th><th>Time</th><th>Instructor</th></tr>
        <tr><td>Monday</td><td>10 AM</td><td>Mr. Sharma</td></tr>
        <tr><td>Wednesday</td><td>2 PM</td><td>Ms. Priya</td></tr>
    </table>
</body>
</html>
