<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Advanced CSS Selectors</title>
  <link rel="stylesheet" href="5.css">
</head>
<body>
  <main>
    <h1>Selectors Demo</h1>

    <form>
      <input type="text" placeholder="text input (type='text')" />
      <input type="email" placeholder="email input" />
      <input type="password" placeholder="password" />
    </form>

    <ul class="links">
      <li><a href="https://example.com">Secure Link</a></li>
      <li><a href="http://example.com">Insecure Link</a></li>
      <li><a href="https://another.com">Another Secure</a></li>
    </ul>

    <ul class="items">
      <li>Item 1</li>
      <li>Item 2 (nth-child)</li>
      <li>Item 3</li>
      <li>Item 4</li>
    </ul>
  </main>
</body>
</html>
